<script type="application/json" id="examples">{"bash":[{"name":"backup.sh","source":"#!/usr/bin/env bash\n# Copy a directory into a dated archive and keep the newest few.\nset -euo pipefail\n\nreadonly KEEP=${KEEP:-5}\ndeclare -a excludes=(--exclude='*.tmp' --exclude=.cache)\n\nusage() {\n  cat >&2 \u003c\u003cEOF\nusage: ${0##*/} [-n] SOURCE DEST\n\n  -n  show what would be done\nEOF\n  exit 2\n}\n\ndry_run=false\nwhile getopts ':n' opt; do\n  case $opt in\n    n) dry_run=true ;;\n    *) usage ;;\n  esac\ndone\nshift $((OPTIND - 1))\n(( $# == 2 )) || usage\n\nsrc=$1 dest=${2%/}\narchive=\"$dest/$(basename \"$src\")-$(date +%Y%m%d).tar.gz\"\n\nif [[ ! -d $src ]]; then\n  echo \"not a directory: $src\" >&2\n  exit 1\nelif $dry_run; then\n  echo \"would write $archive\"\n  exit 0\nfi\n\nmkdir -p \"$dest\"\ntar -czf \"$archive\" \"${excludes[@]}\" -C \"$(dirname \"$src\")\" \"${src##*/}\"\n\n# Delete all but the newest $KEEP archives.\nmapfile -t old \u003c \u003c(ls -1t \"$dest\"/*.tar.gz | tail -n +$((KEEP + 1)))\nfor f in \"${old[@]}\"; do\n  rm -f -- \"$f\" && echo \"removed $f\"\ndone\n"},{"name":"functions.bash","source":"# Small helpers for an interactive shell.\n\n# Make a directory and change into it.\nmkcd() {\n  mkdir -p -- \"$1\" && cd -- \"$1\" || return\n}\n\n# Extract an archive, whatever its kind.\nextract() {\n  local file=$1\n  [[ -f $file ]] || { printf '%s: no such file\\n' \"$file\" >&2; return 1; }\n  case ${file,,} in\n    *.tar.gz|*.tgz) tar -xzf \"$file\" ;;\n    *.tar.xz)       tar -xJf \"$file\" ;;\n    *.zip)          unzip -q \"$file\" ;;\n    *.gz)           gunzip -k \"$file\" ;;\n    *)              echo \"don't know how to extract $file\" >&2; return 1 ;;\n  esac\n}\n\n# Print each directory in $PATH on its own line, numbered.\npath() {\n  local IFS=: i=0 dir\n  for dir in $PATH; do\n    printf '%3d  %s\\n' $((++i)) \"$dir\"\n  done\n}\n\n# Retry a command up to N times, waiting longer after each failure.\nretry() {\n  local tries=$1 delay=1; shift\n  until \"$@\"; do\n    (( --tries > 0 )) || return 1\n    sleep \"$delay\"\n    delay=$(( delay * 2 ))\n  done\n}\n\nalias ll='ls -lh' la='ls -A'\nexport HISTCONTROL=ignoreboth HISTSIZE=10000\n"}],"batch":[{"name":"build.bat","source":"@echo off\nrem Build the project with MSBuild, optionally running the tests.\nsetlocal EnableExtensions EnableDelayedExpansion\n\nset \"ROOT=%~dp0\"\nset CONFIG=Release\nset PLATFORM=x64\nset /a JOBS=%NUMBER_OF_PROCESSORS% * 2\nset RUN_TESTS=\n\n:parse\nif \"%~1\"==\"\" goto :build\nif /i \"%~1\"==\"-c\" (set \"CONFIG=%~2\" & shift & shift & goto :parse)\nif /i \"%~1\"==\"-t\" (set RUN_TESTS=1) & shift & goto :parse\necho Unknown option: %1 1>&2\nexit /b 2\n\n:build\nif not exist \"%ROOT%build\\\" mkdir \"%ROOT%build\"\nfor /f \"usebackq delims=\" %%v in (`git describe --tags --always`) do set \"VERSION=%%v\"\necho Building %VERSION% (%CONFIG%^|%PLATFORM%) with %JOBS% jobs...\n\nmsbuild \"%ROOT%project.sln\" /m:%JOBS% /p:Configuration=%CONFIG% ^\n    /p:Platform=%PLATFORM% /nologo /v:m >\"%ROOT%build\\msbuild.log\" 2>&1\nif errorlevel 1 (\n    echo Build failed, see build\\msbuild.log\n    exit /b 1\n) else if defined RUN_TESTS (\n    for %%t in (\"%ROOT%build\\%CONFIG%\\*_test.exe\") do (\n        echo Running %%~nxt\n        \"%%~t\" || set /a FAILED+=1\n    )\n)\n\nif !FAILED! GTR 0 echo !FAILED! test(s) failed & exit /b 1\necho Done.\nendlocal\ngoto :eof\n"}],"c":[{"name":"list.c","source":"#include \u003cstdio.h>\n#include \u003cstdlib.h>\n\n#define ARRAY_LEN(a) (sizeof(a) / sizeof((a)[0]))\n\ntypedef struct node {\n  int value;\n  struct node *next;\n} node;\n\nstatic node *push(node *head, int value) {\n  node *n = malloc(sizeof *n);\n  if (!n) {\n    perror(\"malloc\");\n    exit(EXIT_FAILURE);\n  }\n  *n = (node){ .value = value, .next = head };\n  return n;\n}\n\nint main(void) {\n  static const int values[] = { 3, 1, 4, 1, 5, 9 };\n  node *list = NULL;\n  for (size_t i = 0; i \u003c ARRAY_LEN(values); i++)\n    list = push(list, values[i]);\n\n  for (node *it = list; it; it = it->next)\n    printf(\"%d%s\", it->value, it->next ? \" -> \" : \"\\n\");\n  return 0;\n}\n"},{"name":"platform.h","source":"#ifndef PLATFORM_H\n#define PLATFORM_H\n\n#include \u003cstdint.h>\n\n#ifdef _WIN32\n#  define API __declspec(dllexport)\n#else\n#  define API __attribute__((visibility(\"default\")))\n#endif\n\n#ifdef __cplusplus\nextern \"C\" {\n#endif\n\nenum log_level : uint8_t { LOG_DEBUG, LOG_INFO, LOG_ERROR };\n\nAPI int platform_init(const char *name) __attribute__((nonnull(1)));\nAPI void platform_log(enum log_level level, const char *fmt, ...);\n\nstatic inline uint32_t rotl32(uint32_t x, int k) {\n  return (x \u003c\u003c k) | (x >> (32 - k));\n}\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* PLATFORM_H */\n"}],"cmake":[{"name":"CMakeLists.txt","source":"cmake_minimum_required(VERSION 3.25)\nproject(Greeter VERSION 1.2.0 LANGUAGES CXX)\n\noption(GREETER_BUILD_TESTS \"Build the tests\" ON)\nset(CMAKE_CXX_STANDARD 20)\n\n#[[\n  The library, built static or shared depending on BUILD_SHARED_LIBS.\n]]\nadd_library(greeter src/greeter.cpp src/format.cpp)\ntarget_include_directories(greeter\n  PUBLIC\n    $\u003cBUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include>\n    $\u003cINSTALL_INTERFACE:include>)\ntarget_compile_options(greeter PRIVATE\n  $\u003c$\u003cCXX_COMPILER_ID:GNU,Clang>:-Wall -Wextra>\n  $\u003c$\u003cCXX_COMPILER_ID:MSVC>:/W4>)\n\nadd_executable(greet src/main.cpp)\ntarget_link_libraries(greet PRIVATE greeter)\n\nif(GREETER_BUILD_TESTS AND NOT CMAKE_CROSSCOMPILING)\n  enable_testing()\n  foreach(name IN ITEMS hello goodbye)\n    add_executable(test_${name} tests/${name}.cpp)\n    target_link_libraries(test_${name} PRIVATE greeter)\n    add_test(NAME ${name} COMMAND test_${name})\n  endforeach()\nendif()\n\ninstall(TARGETS greeter greet)\n"},{"name":"Utilities.cmake","source":"include_guard(GLOBAL)\n\n# Appends a definition to a target, warning when it is already there.\nfunction(greeter_add_definition target name)\n  get_target_property(defs ${target} COMPILE_DEFINITIONS)\n  if(defs AND \"${name}\" IN_LIST defs)\n    message(WARNING \"${target} already defines ${name}\")\n    return()\n  endif()\n  target_compile_definitions(${target} PRIVATE ${name})\nendfunction()\n\nmacro(greeter_option var doc default)\n  if(DEFINED ENV{${var}})\n    set(${var} \"$ENV{${var}}\" CACHE STRING \"${doc}\" FORCE)\n  else()\n    set(${var} ${default} CACHE STRING \"${doc}\")\n  endif()\nendmacro()\n\nset(script [=[\n  print(\"brackets keep ]] and \\\"quotes\\\" as they are\")\n]=])\n\nblock(SCOPE_FOR VARIABLES)\n  string(REPLACE \";\" \"\\;\" escaped \"${script}\")\n  file(WRITE \"${CMAKE_BINARY_DIR}/script.py\" \"${escaped}\")\nendblock()\n"}],"css":[{"name":"style.css","source":"@import url(\"reset.css\") layer(reset);\n\n:root {\n  --accent: #0b5fff;\n  --radius: 0.5rem;\n}\n\n/* Cards nest their own states and children. */\n.card {\n  border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);\n  border-radius: var(--radius);\n  padding: calc(1rem + 2px) 1.5rem;\n\n  &:hover {\n    box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);\n  }\n\n  > h2::after {\n    content: \"\\2192\";\n  }\n\n  @media (width >= 40em) {\n    display: grid;\n    grid-template-columns: [media] 12rem [body] 1fr;\n  }\n}\n\na:not(.button):is(:hover, :focus-visible),\nli:nth-child(2n + 1 of .item) > input[type=\"checkbox\" i] {\n  color: var(--accent) !important;\n}\n\n@keyframes fade-in {\n  from { opacity: 0; }\n  to { opacity: 1; }\n}\n\n@container sidebar (min-width: 300px) {\n  .card { animation: fade-in 200ms ease-out both; }\n}\n"}],"diff":[{"name":"classic.diff","source":"*** config.ini\t2026-11-14 09:00:00.000000000 -0800\n--- config.ini\t2026-11-14 09:05:12.000000000 -0800\n***************\n*** 1,4 ****\n  [server]\n! port = 8080\n  host = localhost\n- debug = true\n--- 1,4 ----\n  [server]\n! port = 9090\n  host = localhost\n+ workers = 4\n2c2\n\u003c port = 8080\n---\n> port = 9090\n4c4\n\u003c debug = true\n---\n> workers = 4\n"},{"name":"fix-greeting.patch","source":"From 3f2a9c1d8e7b6a5f4e3d2c1b0a9f8e7d6c5b4a39 Mon Sep 17 00:00:00 2001\nFrom: Ada Example \u003cada@example.com>\nDate: Sat, 14 Nov 2026 09:12:44 -0800\nSubject: [PATCH] greet: say hello by name\n\nRead the name from the command line and fall back to \"world\".\n---\n src/greet.c     | 9 ++++++---\n docs/logo.png   | Bin 1204 -> 1311 bytes\n 2 files changed, 6 insertions(+), 3 deletions(-)\n\ndiff --git a/src/greet.c b/src/greet.c\nindex 4b1d2e0..a93c7f5 100644\n--- a/src/greet.c\n+++ b/src/greet.c\n@@ -1,9 +1,12 @@\n #include \u003cstdio.h>\n \n-int main(void)\n+int main(int argc, char **argv)\n {\n-    printf(\"hello, world\\n\");\n+    const char *name = argc > 1 ? argv[1] : \"world\";\n+\n+    printf(\"hello, %s\\n\", name);\n     return 0;\n }\n-// TODO: take a name\n+\n\\ No newline at end of file\ndiff --git a/docs/logo.png b/docs/logo.png\nindex 7e0c3a1..b52f9d8 100644\nBinary files a/docs/logo.png and b/docs/logo.png differ\ndiff --git a/README b/README.md\nsimilarity index 88%\nrename from README\nrename to README.md\nindex 1c2d3e4..5f6a7b8 100644\n--- a/README\n+++ b/README.md\n@@ -1,3 +1,3 @@\n-greet\n-=====\n+# greet\n+\n Says hello.\n-- \n2.47.0\n"}],"dockerfile":[{"name":"Dockerfile","source":"# syntax=docker/dockerfile:1\n\nARG GO_VERSION=1.22\n\nFROM --platform=$BUILDPLATFORM golang:${GO_VERSION}-alpine AS build\nWORKDIR /src\nCOPY go.mod go.sum ./\nRUN --mount=type=cache,target=/go/pkg/mod \\\n    go mod download\nCOPY . .\nARG TARGETOS TARGETARCH\nRUN --mount=type=cache,target=/root/.cache/go-build \\\n    CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH \\\n    go build -trimpath -o /out/server ./cmd/server\n\nFROM alpine:3.20 AS runtime\nRUN apk add --no-cache ca-certificates tzdata \\\n    # a non-root user for the server\n    && adduser -D -u 10001 app\nCOPY --from=build --chown=app:app /out/server /usr/local/bin/server\nENV PORT=8080 LOG_LEVEL=\"info\"\nLABEL org.opencontainers.image.title=\"server\" \\\n      org.opencontainers.image.source=\"https://example.com/server\"\nEXPOSE ${PORT}/tcp\nUSER app\nHEALTHCHECK --interval=30s --timeout=3s \\\n    CMD wget -qO- \"http://localhost:${PORT}/healthz\" || exit 1\nENTRYPOINT [\"/usr/local/bin/server\"]\nCMD [\"--listen\", \":8080\"]\n"},{"name":"heredocs.Dockerfile","source":"# syntax=docker/dockerfile:1\nFROM debian:bookworm-slim\n\nRUN \u003c\u003cEOF\nset -eux\napt-get update\napt-get install -y --no-install-recommends nginx\nrm -rf /var/lib/apt/lists/*\nEOF\n\nCOPY \u003c\u003cEOF /etc/nginx/conf.d/default.conf\nserver {\n    listen 80;\n    root /usr/share/nginx/html;\n}\nEOF\n\nRUN python3 \u003c\u003c'PY' > /usr/share/nginx/html/index.html\nprint(\"\u003ch1>Hello from a heredoc\u003c/h1>\")\nPY\n\nSTOPSIGNAL SIGQUIT\nCMD [\"nginx\", \"-g\", \"daemon off;\"]\n"}],"gitattributes":[{"name":"project.gitattributes","source":"# Let git decide which files are text, and check them out with LF.\n* text=auto eol=lf\n\n# Windows scripts keep CRLF.\n*.{bat,[bB][aA][tT]} text eol=crlf\n*.cmd                text eol=crlf\n\n# Binary files: no diffs, no merges, no line-ending conversion.\n*.png  binary\n*.jpg  binary\n*.wasm binary\n\n# Macros bundle attributes under one name.\n[attr]generated linguist-generated=true -diff\nsrc/parser.c      generated\nsrc/*.json        generated\nsrc/tree_sitter/* generated\n\n# Language-aware diff hunks.\n*.[ch]  diff=cpp\n*.py    diff=python\n*.md    diff=markdown whitespace=-blank-at-eol\n\n# Keep tests and tooling out of `git archive`.\n/test/**         export-ignore\n/.github/        export-ignore\n\"docs/old notes\" export-ignore\n\n# Store large assets with Git LFS.\nassets/**/*.psd filter=lfs diff=lfs merge=lfs -text\n"}],"go":[{"name":"hello.go","source":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tfmt.Println(\"Hello, 世界\")\n}\n"},{"name":"stack.go","source":"package stack\n\nimport \"errors\"\n\n// ErrEmpty is returned when popping an empty stack.\nvar ErrEmpty = errors.New(\"stack: empty\")\n\n// Stack is a last-in, first-out collection.\ntype Stack[T any] struct {\n\titems []T\n}\n\n// Push adds v to the top of the stack.\nfunc (s *Stack[T]) Push(v T) {\n\ts.items = append(s.items, v)\n}\n\n// Pop removes and returns the top of the stack.\nfunc (s *Stack[T]) Pop() (T, error) {\n\tvar zero T\n\tif len(s.items) == 0 {\n\t\treturn zero, ErrEmpty\n\t}\n\tv := s.items[len(s.items)-1]\n\ts.items = s.items[:len(s.items)-1]\n\treturn v, nil\n}\n\n// Drain sends every item on a channel, top first, and closes it.\nfunc (s *Stack[T]) Drain() \u003c-chan T {\n\tch := make(chan T)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor {\n\t\t\tv, err := s.Pop()\n\t\t\tif err != nil {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tch \u003c- v\n\t\t}\n\t}()\n\treturn ch\n}\n"}],"html":[{"name":"page.html","source":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>Fish &amp; Chips\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"menu.css\">\n  \u003cstyle>\n    main { max-width: 40rem; margin: 0 auto; }\n    .price::before { content: \"£\"; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>Today&rsquo;s menu\u003c/h1>\n    \u003cul class=\"menu\">\n      \u003cli>Cod \u003cspan class=\"price\">8.50\u003c/span>\n      \u003cli>Haddock \u003cspan class=\"price\">9.00\u003c/span>\n      \u003cli>Mushy peas \u003cspan class=\"price\">2.00\u003c/span>\n    \u003c/ul>\n    \u003cbutton type=\"button\" onclick=\"order('cod')\" style=\"font-weight: bold\">Order\u003c/button>\n  \u003c/main>\n  \u003cscript type=\"module\">\n    const prices: Record\u003cstring, number> = { cod: 8.5, haddock: 9 };\n    export function order(item: string): void {\n      if (prices[item] \u003c 10) console.log(`ordered ${item}`);\n    }\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"},{"name":"table.html","source":"\u003ctable>\n  \u003ccaption>Opening hours\u003c/caption>\n  \u003cthead>\n    \u003ctr>\u003cth>Day\u003cth>Open\u003cth>Close\n  \u003ctbody>\n    \u003ctr>\u003ctd>Monday\u003ctd>11:30\u003ctd>21:00\n    \u003ctr>\u003ctd>Tuesday\u003ctd>11:30\u003ctd>21:00\n    \u003ctr>\u003ctd>Sunday\u003ctd colspan=2>\u003cem>Closed\u003c/em>\n\u003c/table>\n\u003cp>Prices include VAT.\n\u003cp>Call \u003ca href=\"tel:+441234567890\">01234 567890\u003c/a> to book &mdash; 10 &lt; groups &lt; 20 welcome.\n\u003cform action=\"/book\" method=\"post\">\n  \u003clabel>Name \u003cinput name=\"name\" required>\u003c/label>\n  \u003cselect name=\"size\">\n    \u003coption value=\"2\">Two\n    \u003coption value=\"4\" selected>Four\n  \u003c/select>\n  \u003ctextarea name=\"notes\" rows=3>Window seat, if possible &amp; quiet.\u003c/textarea>\n\u003c/form>\n"}],"java":[{"name":"Counter.java","source":"import java.util.HashMap;\nimport java.util.Map;\n\n// A compact source file (Java 25): no class declaration needed.\n\nfinal Map\u003cString, Integer> counts = new HashMap\u003c>();\n\nvoid main() {\n    String text = \"\"\"\n        the quick brown fox\n        jumps over the \"lazy\" dog\\tand the fox\n        \"\"\";\n    for (String word : text.split(\"\\\\s+\")) {\n        counts.merge(word, 1, Integer::sum);\n    }\n    counts.entrySet().stream()\n        .sorted(Map.Entry.\u003cString, Integer>comparingByValue().reversed())\n        .limit(3)\n        .forEach(e -> IO.println(e.getKey() + \": \" + e.getValue()));\n}\n"},{"name":"Shapes.java","source":"package com.example.shapes;\n\nimport java.util.List;\n\n/** A closed shape with an area. */\npublic sealed interface Shape permits Circle, Rectangle {\n    double area();\n\n    static String describe(Shape shape) {\n        return switch (shape) {\n            case Circle(double r) when r == 0 -> \"a point\";\n            case Circle c -> \"a circle of area %.2f\".formatted(c.area());\n            case Rectangle(var w, var h) -> \"a %s by %s rectangle\".formatted(w, h);\n        };\n    }\n}\n\nrecord Circle(double radius) implements Shape {\n    public double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nrecord Rectangle(double width, double height) implements Shape {\n    Rectangle {\n        if (width \u003c 0 || height \u003c 0) {\n            throw new IllegalArgumentException(\"negative size\");\n        }\n    }\n\n    public double area() {\n        return width * height;\n    }\n}\n\nclass Main {\n    public static void main(String[] args) {\n        List\u003cShape> shapes = List.of(new Circle(1), new Rectangle(2, 3));\n        shapes.stream()\n            .map(Shape::describe)\n            .forEach(System.out::println);\n    }\n}\n"}],"json":[{"name":"package.json","source":"{\n  \"name\": \"forest\",\n  \"version\": \"0.2.0\",\n  \"description\": \"A bundle of tree-sitter grammars, packaged for the web\",\n  \"private\": true,\n  \"keywords\": [\"tree-sitter\", \"highlighting\", \"wasm\"],\n  \"scripts\": {\n    \"build\": \"bun web/build.ts\",\n    \"serve\": \"bun web/serve.ts\"\n  },\n  \"engines\": { \"bun\": \">=1.2\" },\n  \"workspaces\": [],\n  \"config\": {\n    \"port\": 8000,\n    \"ratio\": -1.5e-3,\n    \"escapes\": \"tab\\t, quote\\\", snowman \\u2603\",\n    \"unset\": null,\n    \"debug\": false\n  }\n}\n"}],"just":[{"name":"justfile","source":"# Build and release tasks for a small Rust project.\n\nset dotenv-load\nset shell := [\"bash\", \"-euo\", \"pipefail\", \"-c\"]\n\nversion := `cargo pkgid | cut -d'#' -f2`\ntarget := env(\"TARGET\", \"x86_64-unknown-linux-gnu\")\ndist := justfile_directory() / \"dist\" / target\nprofile := if env(\"CI\", \"\") != \"\" { \"release\" } else { \"dev\" }\n\nexport RUST_LOG := \"info\"\n\nalias b := build\nalias t := test\n\n# List the recipes\ndefault:\n    @just --list\n\n# Build the crate\nbuild *flags:\n    cargo build --profile {{ profile }} --target {{ target }} {{ flags }}\n\n# Run the tests, then lint\ntest filter=\"\": build && lint\n    cargo test {{ filter }}\n\n[private]\nlint:\n    -cargo clippy --all-targets -- -D warnings\n    cargo fmt --check\n\n# Package a release archive\n[confirm(\"Publish version \" + version + \"?\")]\n[group('release')]\nrelease: (build \"--locked\") changelog\n    mkdir -p {{ dist }}\n    tar -czf {{ dist }}/app-{{ version }}.tar.gz -C target/{{ target }}/release app\n    @echo {{ GREEN }}Packaged {{ version }}{{ NORMAL }}\n\n# Write the changelog section for this version\nchangelog:\n    #!/usr/bin/env python3\n    import subprocess\n\n    log = subprocess.check_output([\"git\", \"log\", \"--oneline\", \"v{{ version }}..HEAD\"], text=True)\n    with open(\"CHANGELOG.md\", \"a\") as f:\n        f.write(f\"## {{ version }}\\n\\n{log}\")\n"}],"kdl":[{"name":"layout-v1.kdl","source":"// A terminal layout, in KDL 1.0: bare `true` and `false`, and `r\"…\"` raw strings.\nlayout {\n    default_tab_template {\n        pane size=1 borderless=true {\n            plugin location=\"tab-bar\"\n        }\n        children\n    }\n    tab name=\"editor\" focus=true {\n        pane split_direction=\"vertical\" {\n            pane command=\"hx\" size=\"70%\"\n            pane {\n                pane command=\"cargo\" {\n                    args \"watch\" \"-x\" \"test\"\n                }\n                pane cwd=r\"C:\\Users\\dev\\logs\"\n            }\n        }\n    }\n}\npane_frames false\nmouse_mode true\n"},{"name":"service.kdl","source":"/- kdl-version 2\n// A service definition, in KDL 2.0.\n\nservice \"forest-api\" version=(semver)\"2.4.1\" {\n    image registry=\"ghcr.io\" \"nektro/forest\" tag=#null\n    replicas 3\n    restart on-failure max-attempts=5\n\n    listen (ipv4)\"0.0.0.0\" port=8080 tls=#true\n    /- listen (ipv6)\"::\" port=8080   // not yet\n\n    limits cpu=0.5 memory=0x2000_0000 timeout=#inf\n\n    env {\n        LOG_LEVEL info\n        GREETING \"Hello,\\tworld! \\u{1F332}\"\n        WINDOWS_PATH #\"C:\\Program Files\\forest\"#\n    }\n\n    healthcheck \\\n        interval=30 \\\n        retries=3\n\n    /* Startup script.\n       /* Block comments nest. */ */\n    script \"\"\"\n        set -e\n        echo \"starting\"\n        exec forest serve\n        \"\"\"\n\n    mounts { data \"/var/lib/forest\"; cache \"/tmp/forest\" }\n}\n"}],"lua":[{"name":"features.lua","source":"#!/usr/bin/env lua\n--[==[\n  Lua 5.5: global declarations, named varargs and\n  prefixed attributes. Long brackets nest by level: ]] does not end this.\n]==]\nglobal \u003cconst> print, string, ipairs, error\nglobal counter = 0\n\nlocal \u003cconst> PI, TAU = 3.14159, 2 * 3.14159\n\nlocal function sum(...nums)\n  local total = 0\n  for _, n in ipairs(nums) do total = total + n end\n  return total\nend\n\nlocal template = [[\nHello, %s! You have %d new messages.\n]]\n\ndo\n  local f \u003cclose> = setmetatable({}, { __close = function() print(\"closed\") end })\n  print(string.format(template, \"world\", sum(1, 2, 3)))\nend\n\nfor i = 10, 1, -2 do\n  if i % 4 == 0 then goto continue end\n  counter = counter + (i \u003c\u003c 1 | 1) // 3\n  ::continue::\nend\n\nprint((\"%x\"):format(0xFF), 2 ^ -1, \"tab:\\t\", 'quote:\\'', \"\\u{1F600}\")\n"},{"name":"queue.lua","source":"-- A double-ended queue.\nlocal Queue = {}\nQueue.__index = Queue\n\nfunction Queue.new()\n  return setmetatable({ first = 1, last = 0, items = {} }, Queue)\nend\n\nfunction Queue:push(value)\n  self.last = self.last + 1\n  self.items[self.last] = value\nend\n\nfunction Queue:pop()\n  if self.first > self.last then\n    return nil, \"queue is empty\"\n  end\n  local value = self.items[self.first]\n  self.items[self.first] = nil\n  self.first = self.first + 1\n  return value\nend\n\nfunction Queue:__len()\n  return self.last - self.first + 1\nend\n\nlocal q = Queue.new()\nfor i = 1, 3 do q:push(i * 10) end\nprint(#q, q:pop())\n\nreturn Queue\n"}],"make":[{"name":"Makefile","source":"# A small C project.\n\nCC      ?= cc\nCFLAGS  += -O2 -Wall -Wextra\nPREFIX  ?= /usr/local\nVERSION := $(shell git describe --tags 2>/dev/null || echo dev)\n\nSRCS := $(wildcard src/*.c)\nOBJS := $(SRCS:src/%.c=build/%.o)\nDEPS := $(OBJS:.o=.d)\n\nifeq ($(DEBUG),1)\nCFLAGS += -g -DDEBUG\nelse ifdef SANITIZE\nCFLAGS += -fsanitize=$(SANITIZE)\nendif\n\n.PHONY: all clean install\n\nall: build/app\n\nbuild/app: $(OBJS) | build\n\t$(CC) $(LDFLAGS) -o $@ $^ $(LDLIBS)\n\nbuild/%.o: src/%.c | build\n\t@echo \"  CC  $\u003c\"\n\t$(CC) $(CFLAGS) -DVERSION='\"$(VERSION)\"' -MMD -c -o $@ $\u003c\n\nbuild:\n\tmkdir -p $@\n\ninstall: build/app\nifneq ($(DESTDIR),)\n\t@echo \"staging into $(DESTDIR)\"\nendif\n\tinstall -Dm755 $\u003c $(DESTDIR)$(PREFIX)/bin/app\n\nclean:\n\t-rm -rf build\n\n# One test target per test script.\ndefine test-rule\ntest-$(1): build/app\n\t./tests/$(1).sh $$\u003c\nendef\n\nTESTS := $(notdir $(basename $(wildcard tests/*.sh)))\n$(foreach t,$(TESTS),$(eval $(call test-rule,$(t))))\n\n-include $(DEPS)\n"}],"nix":[{"name":"hello.nix","source":"{\n  lib,\n  stdenv,\n  fetchurl,\n  testers,\n  withNls ? true,\n}:\n\nstdenv.mkDerivation (finalAttrs: {\n  pname = \"hello\";\n  version = \"2.12.1\";\n\n  src = fetchurl {\n    url = \"mirror://gnu/hello/hello-${finalAttrs.version}.tar.gz\";\n    hash = \"sha256-jZkUKv2SV28wsM18tCqNxoCZmLxdYH2Idh9RLibH2yA=\";\n  };\n\n  configureFlags = lib.optional (!withNls) \"--disable-nls\";\n\n  doCheck = true;\n\n  postInstall = ''\n    mkdir -p $out/share/doc/hello\n    cp README $out/share/doc/hello/\n  '';\n\n  passthru.tests.version = testers.testVersion { package = finalAttrs.finalPackage; };\n\n  meta = {\n    description = \"Program that produces a familiar, friendly greeting\";\n    homepage = \"https://www.gnu.org/software/hello/\";\n    license = lib.licenses.gpl3Plus;\n    mainProgram = \"hello\";\n    platforms = lib.platforms.all;\n  };\n})\n"},{"name":"module.nix","source":"# A NixOS module for a small web service.\n{ config, lib, pkgs, ... }:\n\nlet\n  cfg = config.services.greeter;\n  inherit (lib) mkEnableOption mkIf mkOption types;\n\n  configFile = pkgs.writeText \"greeter.json\" (builtins.toJSON {\n    inherit (cfg) port;\n    greeting = \"Hello, ${cfg.name}!\";\n  });\nin\n{\n  options.services.greeter = {\n    enable = mkEnableOption \"the greeter service\";\n\n    port = mkOption {\n      type = types.port;\n      default = 8080;\n      description = \"Port to listen on.\";\n    };\n\n    name = mkOption {\n      type = types.str;\n      default = \"world\";\n    };\n  };\n\n  config = mkIf cfg.enable {\n    systemd.services.greeter = {\n      wantedBy = [ \"multi-user.target\" ];\n      serviceConfig.ExecStart = \"${pkgs.greeter}/bin/greeter --config ${configFile}\";\n      environment.GREETER_DEBUG = if cfg.port \u003c 1024 then \"1\" else \"0\";\n    };\n\n    networking.firewall.allowedTCPPorts = lib.optionals (cfg ? port) [ cfg.port ];\n  };\n}\n"}],"python":[{"name":"hello.py","source":"def main() -> None:\n    name = input(\"Name: \")\n    print(f\"Hello, {name or 'world'}!\")\n\n\nif __name__ == \"__main__\":\n    main()\n"},{"name":"inventory.py","source":"\"\"\"A small inventory, with lookups, events and a report.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import dataclass, field\nfrom typing import Iterator\n\nMAX_ITEMS = 1_000\n\n\nclass InventoryError(Exception):\n    pass\n\n\n@dataclass(order=True)\nclass Item:\n    \"\"\"One kind of thing on the shelves.\"\"\"\n\n    name: str\n    price: float = 0.0\n    tags: set[str] = field(default_factory=set)\n\n    @property\n    def label(self) -> str:\n        return f\"{self.name:\u003c12} {self.price:>8.2f}\"\n\n\nclass Inventory[K]:\n    def __init__(self, items: dict[K, Item] | None = None):\n        self._items = dict(items or {})\n\n    def __iter__(self) -> Iterator[Item]:\n        yield from sorted(self._items.values())\n\n    def add(self, key: K, item: Item, /, *, replace=False) -> None:\n        if key in self._items and not replace:\n            raise InventoryError(f\"duplicate key: {key!r}\")\n        elif len(self._items) >= MAX_ITEMS:\n            raise InventoryError(\"inventory is full\")\n        self._items[key] = item\n\n    def find(self, *tags: str) -> list[Item]:\n        # Items that carry every one of the tags.\n        return [item for item in self if all(t in item.tags for t in tags)]\n\n    def handle(self, event: dict) -> str:\n        match event:\n            case {\"type\": \"add\", \"key\": key, \"item\": {\"name\": str(name), **rest}}:\n                self.add(key, Item(name, **rest))\n                return f\"added {name}\"\n            case {\"type\": \"remove\", \"key\": key} if key in self._items:\n                del self._items[key]\n                return \"removed\"\n            case _:\n                return \"ignored\"\n\n    def report(self) -> str:\n        lines = [item.label for item in self]\n        total = sum(item.price for item in self)\n        lines.append(f\"{'total':\u003c12} {total:>8.2f}\")\n        return \"\\n\".join(lines)\n\n\nasync def load(path: str) -> Inventory[str]:\n    inventory = Inventory[str]()\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            for key, data in json.load(f).items():\n                inventory.add(key, Item(**data))\n    except FileNotFoundError:\n        pass\n    return inventory\n"}],"ruby":[{"name":"commands.rb","source":"#!/usr/bin/env ruby\n# A tiny command dispatcher, with pattern matching.\n\nCOMMANDS = %w[add list done help].freeze\n\ndef parse(argv)\n  case argv\n  in [\"add\", *words] if words.any?\n    { action: :add, text: words.join(\" \") }\n  in [\"done\", /\\A\\d+\\z/ => id]\n    { action: :done, id: id.to_i }\n  in [\"list\"] | []\n    { action: :list }\n  in [cmd, *] unless COMMANDS.include?(cmd)\n    { action: :unknown, name: cmd }\n  else\n    { action: :help }\n  end\nend\n\ntasks = []\n\nloop do\n  print \"> \"\n  line = $stdin.gets or break\n\n  case parse(line.split)\n  in { action: :add, text: }\n    tasks \u003c\u003c { text:, done: false }\n  in { action: :done, id: } if (task = tasks[id - 1])\n    task[:done] = true\n  in { action: :list }\n    tasks.each.with_index(1) do |task, i|\n      mark = task[:done] ? \"x\" : \" \"\n      puts \"#{i}. [#{mark}] #{task[:text]}\"\n    end\n  in { action: :unknown, name: }\n    warn \"unknown command: #{name}\"\n  else\n    puts \u003c\u003c~HELP\n      Commands:\n        add TEXT   add a task\n        list       show tasks\n        done N     mark task N done\n    HELP\n  end\nend\n"},{"name":"inventory.rb","source":"# frozen_string_literal: true\n\nrequire \"json\"\n\nmodule Shop\n  # A product line in an inventory.\n  Item = Struct.new(:name, :price, :quantity, keyword_init: true) do\n    def total = price * quantity\n\n    def to_s\n      format(\"%-12s %3d x %8.2f\", name, quantity, price)\n    end\n  end\n\n  class Inventory\n    include Enumerable\n\n    attr_reader :items\n\n    def initialize(items = [])\n      @items = items.to_h { |item| [item.name, item] }\n    end\n\n    def each(&block) = @items.each_value(&block)\n\n    def \u003c\u003c(item)\n      @items[item.name] = item\n      self\n    end\n\n    def restock(name, by: 1)\n      item = @items.fetch(name) { raise KeyError, \"no such item: #{name}\" }\n      item.quantity += by\n    end\n\n    def value\n      sum(&:total).round(2)\n    end\n\n    def low_stock(limit = 5)\n      select { |item| item.quantity \u003c limit }\n        .sort_by(&:quantity)\n        .map(&:name)\n    end\n\n    def report\n      \u003c\u003c~REPORT\n        Inventory (#{count} items, worth #{value})\n        #{map(&:to_s).join(\"\\n\")}\n      REPORT\n    end\n\n    def self.load(path)\n      data = JSON.parse(File.read(path), symbolize_names: true)\n      new(data.map { |attrs| Item.new(**attrs) })\n    rescue Errno::ENOENT, JSON::ParserError => e\n      warn \"could not load #{path}: #{e.message}\"\n      new\n    end\n  end\nend\n\ninventory = Shop::Inventory.new\ninventory \u003c\u003c Shop::Item.new(name: \"widget\", price: 2.5, quantity: 10)\ninventory \u003c\u003c Shop::Item.new(name: \"gadget\", price: 12.0, quantity: 3)\ninventory.restock \"gadget\", by: 2\n\nputs inventory.report\nputs \"Low stock: #{inventory.low_stock.join(', ')}\" unless inventory.low_stock.empty?\n"}],"rust":[{"name":"lexer.rs","source":"/* A tiny lexer. /* Comments nest. */ */\n\n#[derive(Debug, PartialEq)]\nenum Token\u003c'src> {\n    Number(u64),\n    Ident(&'src str),\n    Punct(char),\n}\n\nstruct Lexer\u003c'src> {\n    rest: &'src str,\n}\n\nimpl\u003c'src> Iterator for Lexer\u003c'src> {\n    type Item = Token\u003c'src>;\n\n    fn next(&mut self) -> Option\u003cSelf::Item> {\n        self.rest = self.rest.trim_start();\n        let c = self.rest.chars().next()?;\n        let len = match c {\n            '0'..='9' => self.rest.find(|c: char| !c.is_ascii_digit()),\n            'a'..='z' | 'A'..='Z' | '_' => {\n                self.rest.find(|c: char| !c.is_alphanumeric() && c != '_')\n            }\n            _ => Some(c.len_utf8()),\n        }\n        .unwrap_or(self.rest.len());\n        let (text, rest) = self.rest.split_at(len);\n        self.rest = rest;\n        Some(match c {\n            '0'..='9' => Token::Number(text.parse().ok()?),\n            _ if len == 1 && !c.is_alphanumeric() => Token::Punct(c),\n            _ => Token::Ident(text),\n        })\n    }\n}\n\nfn main() {\n    let src = r#\"let x = 42; // \"quoted\"\"#;\n    let tokens: Vec\u003c_> = Lexer { rest: src }.collect();\n    assert_eq!(tokens[0], Token::Ident(\"let\"));\n    println!(\"{tokens:#?}\");\n}\n"},{"name":"shapes.rs","source":"//! Shapes and their areas.\n\nuse std::f64::consts::PI;\nuse std::fmt;\n\n/// Something with an area.\npub trait Shape: fmt::Debug {\n    fn area(&self) -> f64;\n\n    fn describe(&self) -> String {\n        format!(\"{self:?} has area {:.2}\", self.area())\n    }\n}\n\n#[derive(Debug, Clone, Copy)]\npub enum Kind {\n    Circle { radius: f64 },\n    Rect(f64, f64),\n}\n\nimpl Shape for Kind {\n    fn area(&self) -> f64 {\n        match *self {\n            Kind::Circle { radius } => PI * radius * radius,\n            Kind::Rect(w, h) if w == h => w * w, // a square\n            Kind::Rect(w, h) => w * h,\n        }\n    }\n}\n\nfn main() {\n    let shapes = [Kind::Circle { radius: 1. }, Kind::Rect(2.0, 3.0)];\n    let total: f64 = shapes.iter().map(|s| s.area()).sum();\n    for s in &shapes {\n        println!(\"{}\", s.describe());\n    }\n    println!(\"total: {total:.1}\");\n}\n"}],"scss":[{"name":"_buttons.scss","source":"@use \"sass:map\";\n@use \"sass:math\";\n\n$button-padding: 0.5rem 1rem !default;\n$button-variants: (\n  \"primary\": #0d6efd,\n  \"danger\": #dc3545,\n) !default;\n\n@mixin button-variant($background, $hover: darken($background, 8%)) {\n  background-color: $background;\n  border-color: $background;\n\n  &:hover,\n  &:focus-visible {\n    background-color: $hover;\n  }\n}\n\n.btn {\n  display: inline-block;\n  padding: $button-padding;\n  border-radius: math.div(1rem, 4);\n  transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;\n\n  @each $name, $color in $button-variants {\n    &-#{$name} {\n      @include button-variant($color);\n    }\n  }\n\n  &:disabled > .icon,\n  &.is-loading::after {\n    opacity: if(sass($enable-shadows): 0.65; else: 0.5);\n  }\n}\n"},{"name":"_grid.scss","source":"// A twelve-column grid.\n$columns: 12;\n$breakpoints: (sm: 576px, md: 768px, lg: 992px);\n\n@function percentage-of($n) {\n  @return math.div($n, $columns) * 100%;\n}\n\n@mixin media-up($name) {\n  @if map.has-key($breakpoints, $name) {\n    @media (min-width: map.get($breakpoints, $name)) {\n      @content;\n    }\n  } @else {\n    @error \"Unknown breakpoint `#{$name}`.\";\n  }\n}\n\n.row {\n  --gutter: 1.5rem;\n  display: flex;\n  margin: 0 calc(var(--gutter) / -2);\n\n  > * {\n    flex: 1 0 0%;\n  }\n}\n\n@for $i from 1 through $columns {\n  .col-#{$i} {\n    flex: 0 0 auto;\n    width: percentage-of($i);\n  }\n}\n\n@include media-up(md) {\n  .row { --gutter: 2rem }\n}\n\n@keyframes fade-in {\n  from { opacity: 0; }\n  to { opacity: 1; }\n}\n"}],"sql":[{"name":"mysql.sql","source":"-- MySQL dump-style schema and data.\n\n/*!40101 SET NAMES utf8mb4 */;\nSET FOREIGN_KEY_CHECKS = 0;\n\nDROP TABLE IF EXISTS `orders`;\nCREATE TABLE `orders` (\n  `id` int(11) unsigned NOT NULL AUTO_INCREMENT,\n  `customer_id` int(11) unsigned NOT NULL,\n  `status` enum('new','paid','shipped') NOT NULL DEFAULT 'new',\n  `total` decimal(10,2) NOT NULL DEFAULT 0.00,\n  `note` varchar(255) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci DEFAULT NULL,\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  `updated_at` timestamp NULL DEFAULT NULL ON UPDATE CURRENT_TIMESTAMP,\n  PRIMARY KEY (`id`),\n  KEY `idx_customer` (`customer_id`),\n  UNIQUE KEY `uniq_note` (`note`(64)),\n  CONSTRAINT `fk_customer` FOREIGN KEY (`customer_id`) REFERENCES `customers` (`id`) ON DELETE CASCADE\n) ENGINE=InnoDB AUTO_INCREMENT=42 DEFAULT CHARSET=utf8mb4 COMMENT='customer orders';\n\nINSERT INTO `orders` (`customer_id`, `status`, `total`) VALUES (1, 'new', 9.99), (2, 'paid', 120.00)\n  ON DUPLICATE KEY UPDATE `total` = VALUES(`total`);\n\nINSERT IGNORE INTO tags SET name = 'sale', created_at = NOW();\nREPLACE INTO settings (k, v) VALUES ('theme', 'dark');\n\nSELECT o.id, c.name, IF(o.total > 100, 'big', 'small') AS size,\n       GROUP_CONCAT(DISTINCT t.name ORDER BY t.name SEPARATOR ', ') AS tags\nFROM orders o\n  STRAIGHT_JOIN customers c ON c.id = o.customer_id\n  LEFT JOIN order_tags ot USING (order_id)\n  LEFT JOIN tags t FORCE INDEX (PRIMARY) ON t.id = ot.tag_id\nWHERE o.created_at >= CURDATE() AND @min_total \u003c= o.total\nGROUP BY o.id WITH ROLLUP\nORDER BY o.total DESC\nLIMIT 10, 20;\n\nUPDATE orders SET status = 'shipped' WHERE status = 'paid' ORDER BY created_at LIMIT 100;\nDELETE FROM sessions WHERE expires_at \u003c NOW() LIMIT 1000;\n\nALTER TABLE orders ADD COLUMN discount decimal(5,2) DEFAULT NULL AFTER total, ENGINE = InnoDB;\nSET @@session.sql_mode = 'STRICT_TRANS_TABLES', @rows := 0;\nSHOW CREATE TABLE orders;\nDESCRIBE orders;\nUSE shop;\nSET FOREIGN_KEY_CHECKS = 1;\n"},{"name":"postgres.sql","source":"-- A PostgreSQL schema with a function, a trigger, and some queries, as a\n-- psql script.\n\\set ON_ERROR_STOP on\n\nCREATE SCHEMA IF NOT EXISTS shop;\n\nCREATE TYPE shop.order_status AS ENUM ('new', 'paid', 'shipped');\n\nCREATE TABLE shop.orders (\n  id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  customer_id bigint NOT NULL REFERENCES shop.customers (id) ON DELETE CASCADE,\n  status shop.order_status NOT NULL DEFAULT 'new',\n  items jsonb NOT NULL DEFAULT '[]'::jsonb,\n  total numeric(10, 2) GENERATED ALWAYS AS ((items -> 0 ->> 'price')::numeric) STORED,\n  placed_at timestamp with time zone NOT NULL DEFAULT now(),\n  CONSTRAINT positive_total CHECK (total >= 0)\n) PARTITION BY RANGE (placed_at);\n\nCREATE INDEX CONCURRENTLY IF NOT EXISTS orders_items_idx\n  ON shop.orders USING gin (items jsonb_path_ops) WHERE status \u003c> 'shipped';\n\n/* Keep updated_at current. /* Comments nest. */ */\nCREATE OR REPLACE FUNCTION shop.touch() RETURNS trigger\nLANGUAGE plpgsql AS $body$\nBEGIN\n  NEW.updated_at := now();\n  RETURN NEW;\nEND\n$body$;\n\nCREATE TRIGGER orders_touch BEFORE UPDATE ON shop.orders\n  FOR EACH ROW WHEN (OLD.* IS DISTINCT FROM NEW.*)\n  EXECUTE FUNCTION shop.touch();\n\nCREATE FUNCTION shop.order_count(p_customer bigint, OUT n bigint)\nLANGUAGE sql STABLE PARALLEL SAFE\nBEGIN ATOMIC\n  SELECT count(*) FROM shop.orders WHERE customer_id = p_customer;\nEND;\n\nWITH recent AS MATERIALIZED (\n  SELECT customer_id, sum(total) FILTER (WHERE status = 'paid') AS paid\n  FROM shop.orders\n  WHERE placed_at > now() - interval '30 days'\n  GROUP BY ROLLUP (customer_id)\n)\nSELECT c.name,\n       r.paid,\n       rank() OVER (ORDER BY r.paid DESC NULLS LAST) AS position,\n       array_agg(DISTINCT o.status ORDER BY o.status) AS statuses,\n       CASE WHEN r.paid > 1000 THEN 'gold' ELSE 'standard' END AS tier\nFROM recent r\n  JOIN shop.customers c ON c.id = r.customer_id\n  LEFT JOIN LATERAL (\n    SELECT status FROM shop.orders WHERE customer_id = c.id LIMIT 3\n  ) o ON true\nWHERE c.email ILIKE '%@example.com' AND c.tags && ARRAY['vip', 'beta']\nGROUP BY c.name, r.paid\nORDER BY position\nFETCH FIRST 10 ROWS ONLY;\n\nINSERT INTO shop.orders (customer_id, items)\nVALUES ($1, jsonb_build_array(jsonb_build_object('sku', $2, 'price', $3)))\nON CONFLICT ON CONSTRAINT orders_pkey DO NOTHING\nRETURNING id, placed_at AT TIME ZONE 'UTC' AS placed_utc;\n\nUPDATE shop.orders o SET status = 'shipped'\nFROM shop.shipments s\nWHERE s.order_id = o.id AND s.sent_at IS NOT NULL\nRETURNING o.*;\n\nMERGE INTO shop.stock t USING shop.deliveries d ON t.sku = d.sku\nWHEN MATCHED THEN UPDATE SET qty = t.qty + d.qty\nWHEN NOT MATCHED THEN INSERT (sku, qty) VALUES (d.sku, d.qty);\n\nCOPY shop.customers (id, name) FROM stdin;\n1\tAda\n2\tGrace\n\\.\n\nSELECT name FROM shop.customers WHERE id = :'customer_id' \\gset\nEXPLAIN (ANALYZE, BUFFERS) SELECT * FROM shop.orders WHERE items @> '[{\"sku\": \"x\"}]';\nGRANT SELECT, INSERT ON ALL TABLES IN SCHEMA shop TO app_user;\n"},{"name":"sqlite.sql","source":"-- A small SQLite schema with an FTS index and an upsert.\nPRAGMA foreign_keys = ON;\nPRAGMA main.journal_mode = WAL;\n\n.mode box\n.headers on\n\nCREATE TABLE IF NOT EXISTS notes (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  title TEXT NOT NULL COLLATE NOCASE,\n  body TEXT,\n  [created at] TEXT DEFAULT (datetime('now')),\n  tags TEXT CHECK (json_valid(tags)),\n  UNIQUE (title) ON CONFLICT REPLACE\n) STRICT;\n\nCREATE VIRTUAL TABLE notes_fts USING fts5(title, body, content='notes', content_rowid='id');\n\nCREATE TRIGGER IF NOT EXISTS notes_ai AFTER INSERT ON notes\nBEGIN\n  INSERT INTO notes_fts (rowid, title, body) VALUES (new.id, new.title, new.body);\nEND;\n\nINSERT INTO notes (title, body, tags) VALUES (?1, ?2, json_array('todo'))\n  ON CONFLICT (title) DO UPDATE SET body = excluded.body WHERE excluded.body IS NOT NULL;\n\nINSERT OR IGNORE INTO notes (title) VALUES (:title), ($title), (@title);\n\nWITH RECURSIVE counter(n) AS (\n  SELECT 1\n  UNION ALL\n  SELECT n + 1 FROM counter WHERE n \u003c 10\n)\nSELECT n, n * n AS 'square' FROM counter;\n\nSELECT n.id, n.title, highlight(notes_fts, 1, '\u003cb>', '\u003c/b>') AS snippet\nFROM notes_fts JOIN notes n ON n.id = notes_fts.rowid\nWHERE notes_fts MATCH 'sqlite NOT mysql'\n  AND n.tags->>'$[0]' = 'todo'\n  AND n.body NOT NULL\nORDER BY rank\nLIMIT 5 OFFSET 0;\n\nSELECT t.value FROM notes, json_each(notes.tags) AS t WHERE t.value GLOB 'to*';\n\nATTACH DATABASE 'archive.db' AS archive;\nINSERT INTO archive.notes SELECT * FROM main.notes WHERE id IN (SELECT id FROM notes LIMIT 10);\nDETACH archive;\nVACUUM;\nEXPLAIN QUERY PLAN SELECT * FROM notes INDEXED BY sqlite_autoindex_notes_1 WHERE title = 'x';\n"}],"swift":[{"name":"fetch.swift","source":"enum FetchError: Error {\n    case badStatus(Int)\n    case empty\n}\n\nactor Cache\u003cKey: Hashable & Sendable, Value: Sendable> {\n    private var storage: [Key: Value] = [:]\n\n    func value(for key: Key, orInsert make: @Sendable () async throws -> Value) async rethrows -> Value {\n        if let cached = storage[key] {\n            return cached\n        }\n        let value = try await make()\n        storage[key] = value\n        return value\n    }\n}\n\nfunc load(_ id: Int, from cache: Cache\u003cInt, String>) async {\n    do {\n        let body = try await cache.value(for: id) {\n            guard id > 0 else { throw FetchError.badStatus(404) }\n            return #\"{\"id\": \\#(id)}\"#\n        }\n        print(body)\n    } catch FetchError.badStatus(let code) where code >= 500 {\n        print(\"server error \\(code)\")\n    } catch {\n        print(\"failed: \\(error)\")\n    }\n}\n"},{"name":"shapes.swift","source":"import Foundation\n\n/// Something with an area.\nprotocol Shape {\n    var area: Double { get }\n}\n\nstruct Circle: Shape {\n    var radius: Double\n\n    var area: Double { .pi * radius * radius }\n}\n\nstruct Rectangle: Shape, Equatable {\n    var width = 1.0, height = 1.0\n\n    var area: Double { width * height }\n}\n\nfunc describe(_ shapes: [any Shape]) -> String {\n    let total = shapes.map(\\.area).reduce(0, +)\n    let largest = shapes.max { $0.area \u003c $1.area }\n    guard let largest else { return \"no shapes\" }\n    return \"total \\(total), largest \\(type(of: largest)) (\\(largest.area))\"\n}\n\nprint(describe([Circle(radius: 2), Rectangle(width: 3, height: 4)]))\n"}],"typescript":[{"name":"store.ts","source":"import { EventEmitter } from \"node:events\";\nimport type { Logger } from \"./logger\";\n\nexport type Listener\u003cT> = (value: T, previous: T | undefined) => void;\n\nexport interface StoreOptions\u003cT> {\n  readonly name: string\n  initial?: T\n  equals?(a: T, b: T): boolean\n}\n\ntype Keys\u003cT> = { [K in keyof T]-?: T[K] extends Function ? never : K }[keyof T];\n\n/** A value that notifies listeners when it changes. */\nexport class Store\u003cT extends object> extends EventEmitter {\n  #value: T | undefined\n  private readonly listeners = new Set\u003cListener\u003cT>>()\n\n  constructor(private options: StoreOptions\u003cT>, protected log?: Logger) {\n    super()\n    this.#value = options.initial\n  }\n\n  get value(): T | undefined {\n    return this.#value\n  }\n\n  set(next: T): void {\n    const previous = this.#value\n    if (previous !== undefined && this.options.equals?.(previous, next)) return\n    this.#value = next\n    for (const listener of this.listeners) listener(next, previous)\n    this.log?.debug(`${this.options.name} changed`)\n  }\n\n  subscribe(listener: Listener\u003cT>): () => void {\n    this.listeners.add(listener)\n    return () => this.listeners.delete(listener)\n  }\n\n  pick\u003cK extends Keys\u003cT>>(...keys: K[]): Pick\u003cT, K> {\n    const out = {} as Pick\u003cT, K>\n    for (const key of keys) out[key] = this.#value![key]\n    return out\n  }\n}\n\nexport function isStore(x: unknown): x is Store\u003cobject> {\n  return x instanceof Store\n}\n\nexport const counter = new Store\u003c{ count: number }>({ name: \"counter\", initial: { count: 0 } })\n"},{"name":"todo-list.tsx","source":"import { useState, type FormEvent } from \"react\";\n\ninterface Todo {\n  id: number;\n  text: string;\n  done: boolean;\n}\n\nexport function TodoList({ initial = [] }: { initial?: Todo[] }) {\n  const [todos, setTodos] = useState\u003cTodo[]>(initial);\n  const [draft, setDraft] = useState(\"\");\n\n  const add = (event: FormEvent) => {\n    event.preventDefault();\n    if (!draft.trim()) return;\n    setTodos(ts => [...ts, { id: Date.now(), text: draft, done: false }]);\n    setDraft(\"\");\n  };\n\n  const toggle = (id: number) =>\n    setTodos(ts => ts.map(t => (t.id === id ? { ...t, done: !t.done } : t)));\n\n  return (\n    \u003cform onSubmit={add} className=\"todo-list\">\n      \u003cinput value={draft} onChange={e => setDraft(e.target.value)} aria-label=\"New todo\" />\n      \u003cul>\n        {todos.map(todo => (\n          \u003cli key={todo.id} data-done={todo.done} onClick={() => toggle(todo.id)}>\n            {todo.done ? \u003cs>{todo.text}\u003c/s> : todo.text}\n          \u003c/li>\n        ))}\n      \u003c/ul>\n      \u003cp>{todos.filter(t => !t.done).length} left &mdash; keep going\u003c/p>\n    \u003c/form>\n  );\n}\n"}],"verilog":[{"name":"counter.v","source":"`timescale 1ns / 1ps\n`define WIDTH 8\n\n// An up-counter with synchronous load and an active-low reset.\nmodule counter #(\n  parameter W = `WIDTH\n) (\n  input  wire         clk,\n  input  wire         rst_n,\n  input  wire         load,\n  input  wire [W-1:0] d,\n  output reg  [W-1:0] q,\n  output wire         wrap\n);\n  assign wrap = &q;\n\n  always @(posedge clk or negedge rst_n) begin\n    if (!rst_n)\n      q \u003c= {W{1'b0}};\n    else if (load)\n      q \u003c= d;\n    else\n      q \u003c= q + 1'b1;\n  end\nendmodule\n"},{"name":"primitives.v","source":"// A user-defined primitive and gate-level netlist.\nprimitive dff_udp (output reg q, input d, clk);\n  table\n  // d  clk  : q : q+\n     0  (01) : ? : 0 ;\n     1  (01) : ? : 1 ;\n     ?  (?0) : ? : - ;\n     *   ?   : ? : - ;\n  endtable\nendprimitive\n\nmodule half_adder (output s, c, input a, b);\n  xor #1 g_sum (s, a, b);\n  and #1 g_carry (c, a, b);\n\n  specify\n    (a, b *> s) = (1.2, 1.4);\n    (a, b *> c) = 1.0;\n  endspecify\nendmodule\n"},{"name":"testbench.v","source":"`timescale 1ns / 1ps\n\nmodule counter_tb;\n  reg clk = 0, rst_n = 0, load = 0;\n  reg [7:0] d = 8'hF0;\n  wire [7:0] q;\n  wire wrap;\n  integer cycles;\n\n  counter #(.W(8)) dut (\n    .clk(clk), .rst_n(rst_n), .load(load), .d(d), .q(q), .wrap(wrap)\n  );\n\n  always #5 clk = ~clk;\n\n  initial begin\n    $dumpfile(\"counter.vcd\");\n    $dumpvars(0, counter_tb);\n    repeat (2) @(posedge clk);\n    rst_n = 1;\n    @(negedge clk) load = 1;\n    @(negedge clk) load = 0;\n    for (cycles = 0; !wrap && cycles \u003c 32; cycles = cycles + 1)\n      @(posedge clk);\n    $display(\"wrapped after %0d cycles at %t\", cycles, $time);\n    $finish;\n  end\nendmodule\n"}],"xml":[{"name":"catalog.xml","source":"\u003c?xml version=\"1.0\" standalone=\"yes\"?>\n\u003c!DOCTYPE catalog [\n  \u003c!ENTITY % inline \"#PCDATA | em\">\n  \u003c!ELEMENT catalog (book+)>\n  \u003c!ELEMENT book (title, author*, price?)>\n  \u003c!ELEMENT title (%inline;)*>\n  \u003c!ELEMENT author (#PCDATA)>\n  \u003c!ELEMENT price EMPTY>\n  \u003c!ATTLIST book\n    id       ID              #REQUIRED\n    format   (paper|ebook)   \"paper\">\n  \u003c!ATTLIST price\n    currency NMTOKEN         #FIXED \"EUR\"\n    amount   CDATA           #REQUIRED>\n  \u003c!ENTITY publisher \"Grove &amp; Root\">\n]>\n\u003ccatalog>\n  \u003cbook id=\"b1\" format=\"ebook\">\n    \u003ctitle>Reading \u003cem>Trees\u003c/em>\u003c/title>\n    \u003cauthor>A. Gardener\u003c/author>\n    \u003cprice amount=\"12.50\"/>\n  \u003c/book>\n\u003c/catalog>\n"},{"name":"feed.xml","source":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003c?xml-stylesheet href=\"feed.xsl\" type=\"text/xsl\"?>\n\u003cfeed xmlns=\"http://www.w3.org/2005/Atom\" xml:lang=\"en\">\n  \u003ctitle>Forest releases\u003c/title>\n  \u003clink href=\"https://example.org/releases\" rel=\"alternate\"/>\n  \u003cupdated>2026-11-12T09:00:00Z\u003c/updated>\n  \u003c!-- Newest entries first. -->\n  \u003centry>\n    \u003ctitle>XML support\u003c/title>\n    \u003cid>urn:uuid:1225c695-cfb8-4ebb-aaaa-80da344efa6a\u003c/id>\n    \u003csummary type=\"html\">Highlighting for &lt;xml&gt; &amp; DTDs &#8212; no scanner.\u003c/summary>\n    \u003ccontent type=\"xhtml\">\u003c![CDATA[\u003cp>if (a \u003c b && b > c) { ... }\u003c/p>]]>\u003c/content>\n  \u003c/entry>\n\u003c/feed>\n"}],"yaml":[{"name":"deployment.yaml","source":"# A Kubernetes deployment and its service, as two documents.\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n  labels: &labels\n    app: web\n    tier: frontend\nspec:\n  replicas: 3\n  selector:\n    matchLabels: *labels\n  template:\n    metadata:\n      labels: *labels\n    spec:\n      containers:\n        - name: web\n          image: \"nginx:1.27\"\n          ports:\n            - containerPort: 80\n              protocol: TCP\n          env:\n            - { name: LOG_LEVEL, value: info }\n            - name: GREETING\n              value: >-\n                Hello from a folded\n                block scalar.\n          resources:\n            limits: {cpu: 500m, memory: 128Mi}\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: web\nspec:\n  type: ClusterIP\n  selector:\n    app: web\n  ports:\n  - port: 80\n    targetPort: 80\n...\n"},{"name":"workflow.yml","source":"# A GitHub Actions workflow\nname: CI\non:\n  push:\n    branches: [main, \"release/*\"]\n  pull_request:\n\nenv:\n  RUST_BACKTRACE: 1\n  DEBUG: false\n\njobs:\n  test:\n    runs-on: ${{ matrix.os }}\n    strategy:\n      matrix:\n        os:\n        - ubuntu-latest\n        - macos-latest\n        version: [1.0, 2.5e3, ~]\n    steps:\n      - uses: actions/checkout@v4\n      - name: Build\n        run: |\n          cargo build --release\n          # not a comment\n          echo done\n      - name: A long\n          plain scalar\n        with: { key: value, other: 'it''s' }\n      - &step\n        name: anchored\n      - *step\n      - ? complex key\n        : complex value\n"}],"zig":[{"name":"hello.zig","source":"const std = @import(\"std\");\n\n/// Greets the world — or anyone else.\npub fn main() !void {\n    const name = \"wörld 🌍\";\n    for (0..3) |i| {\n        std.debug.print(\"hello, {s} #{d}\\n\", .{ name, i });\n    }\n}\n\ntest \"math\" {\n    try std.testing.expectEqual(@as(u32, 4), 2 + 2);\n}\n"},{"name":"point.zig","source":"const Point = struct {\n    x: f32 = 0.0,\n    y: f32 = 0.0,\n\n    pub fn len(self: Point) f32 {\n        return @sqrt(self.x * self.x + self.y * self.y);\n    }\n};\n"}]}</script>
<script>
  const EXAMPLES = JSON.parse(document.getElementById("examples").textContent);
  const $ = (id) => document.getElementById(id);
  const option = (value, text = value) => Object.assign(document.createElement("option"), { value, text });

  $("languages").textContent = Forest.languages.join(", ");

  // Live editor.
  let grammar = null;
  let generation = 0;
  const update = async () => {
    if (!grammar) return;
    const source = $("input").value;
    const mine = generation;
    // Fetch grammars for injected languages (CSS in HTML, ...) first.
    await grammar.loadInjections(source);
    if (mine !== generation || source !== $("input").value) return;
    $("output").innerHTML = grammar.highlightHTML(source);
    const tree = grammar.parse(source);
    $("tree").textContent = tree.rootNode.toString();
    tree.delete();
  };
  const pickExample = () => {
    const list = EXAMPLES[$("language").value] ?? [];
    $("input").value = list[Number($("example").value)]?.source ?? "";
    update();
  };
  const pickLanguage = async () => {
    const lang = $("language").value;
    $("example").replaceChildren(...(EXAMPLES[lang] ?? []).map((ex, i) => option(i, ex.name)));
    const mine = ++generation;
    grammar = null;
    const loaded = await Forest.load(lang);
    if (mine !== generation) return;
    grammar = loaded;
    pickExample();
  };
  $("language").replaceChildren(...Forest.languages.map((lang) => option(lang)));
  $("language").addEventListener("change", pickLanguage);
  $("example").addEventListener("change", pickExample);
  $("input").addEventListener("input", update);
  pickLanguage();
</script>
