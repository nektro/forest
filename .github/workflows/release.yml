name: Publish

on:
  push:
    branches:
      - main
    # tags:
    #   - '*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
        contents: read
        id-token: write

    steps:
      - run: echo Triggered by tag ${{ github.ref_name }}
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build
      - run: npm publish --provenance --access public
